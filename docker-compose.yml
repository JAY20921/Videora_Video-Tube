version: '3.8'

services:
  api:
    build:
      context: ./Vidora-backend
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEILI_HOST=http://meilisearch:7700
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - ./Vidora-backend/.env
    depends_on:
      - redis
      - meilisearch
      - qdrant

  worker:
    build:
      context: ./Vidora-backend
    command: npm run worker
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./Vidora-backend/.env
    depends_on:
      - redis

  ai-worker:
    build:
      context: ./Vidora-backend
    command: npm run ai-worker
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - ./Vidora-backend/.env
    depends_on:
      - redis
      - qdrant

  frontend:
    build:
      context: ./vidora-frontend
    ports:
      - "80:80"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    env_file:
      - ./Vidora-backend/.env # For MEILI_MASTER_KEY
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  redis_data:
  meili_data:
  qdrant_data:
